name: Maven Verify (with a ROM)

# The suite build.yml runs, plus the tests that need a retail ROM.
#
# Those tests skip rather than fail when no ROM is present (see TestRoms), so build.yml covers
# everything else on every push and this covers the remainder - the parsers, the filesystem, and
# the scanned NCGR path, none of which have coverage that runs on a hosted runner.
#
# Manual only, and it needs a runner that already has a ROM on disk: pass the directory holding
# it as rom_dir, and rom_name if the file is not called HeartGold.nds. Nothing here fetches one.
# A hosted runner has no ROM, so a run there is not an error - every ROM-dependent test simply
# skips and the job passes, exactly as build.yml does.

on:
  workflow_dispatch:
    inputs:
      rom_dir:
        description: 'Directory on the runner holding the test ROM'
        required: false
        default: '.'
      rom_name:
        description: 'ROM filename, if not HeartGold.nds'
        required: false
        default: 'HeartGold.nds'
      runner:
        description: 'Runner label - a hosted runner has no ROM, so its ROM tests will skip'
        required: false
        default: 'ubuntu-latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}

    strategy:
      # Report every JDK's result rather than stopping at the first failure --
      # knowing whether a break is version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # 17 is the floor: the test sources use java.util.HexFormat.
        # The main sources still target Java 8, which the compiler settings enforce.
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Says plainly which suite actually ran, because a pass means two very different things
      # depending on whether the ROM was found.
      - name: Report whether a ROM is present
        run: |
          rom="${{ github.event.inputs.rom_dir || '.' }}/${{ github.event.inputs.rom_name || 'HeartGold.nds' }}"
          if [ -f "$rom" ]; then
            echo "::notice title=ROM found::$rom -- the ROM-dependent tests will run."
          else
            echo "::warning title=No ROM at $rom::Every ROM-dependent test will skip, so this run covers no more than the Build workflow does."
          fi

      - name: Build and test
        run: >
          mvn -B -ntp verify
          -Drom.dir='${{ github.event.inputs.rom_dir || '.' }}'
          -Drom.name='${{ github.event.inputs.rom_name || 'HeartGold.nds' }}'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
