name: Quality gates

# CRAP and dryer ratchet. Coverage is regenerated so a stale report cannot raise a score.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crap-and-dry:
    name: CRAP and duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coverage, crapper, and dryer
        env:
          QUALITY_BASE: origin/${{ github.base_ref || 'main' }}
        # Tests use HexFormat, so 17 is the floor. The sources still target 8.
        run: |
          scripts/quality/coverage.sh
          scripts/quality/check-quality.sh --base "$QUALITY_BASE"
